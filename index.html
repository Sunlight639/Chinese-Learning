<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習中文</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans SC",
        "Noto Sans",
        Arial,
        sans-serif;
      background: #f7f7f8;
      color: #222;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100vh;
    }

    .topbar {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #222;
    }

    .container {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .page-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title h1 {
      margin-bottom: 8px;
      font-size: 30px;
    }

    .page-title p {
      color: #777;
      margin: 0;
    }

    .card {
      background: #fff;
      border: 1px solid #e7e7e7;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 5px 18px rgba(0,0,0,.04);
      margin-bottom: 18px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .level-card {
      background: #fff;
      border: 2px solid #e5e5e5;
      border-radius: 15px;
      padding: 20px 15px;
      text-align: center;
      transition: .2s;
    }

    .level-card:hover {
      border-color: #222;
      transform: translateY(-2px);
    }

    .level-name {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .word-count {
      color: #777;
      font-size: 14px;
    }

    .add-level-card {
      border-style: dashed;
    }

    .add-level-symbol {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .primary {
      border: 0;
      background: #222;
      color: #fff;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 600;
    }

    .primary:hover {
      background: #000;
    }

    .secondary {
      border: 1px solid #ddd;
      background: #fff;
      color: #222;
      border-radius: 12px;
      padding: 11px 18px;
      font-weight: 600;
    }

    .danger {
      color: #c62828;
    }

    .back-btn {
      border: 0;
      background: transparent;
      color: #666;
      padding: 5px 0;
      margin-bottom: 20px;
    }

    .back-btn:hover {
      color: #111;
    }

    .selected-level {
      text-align: center;
      margin-bottom: 25px;
    }

    .selected-level .level {
      font-size: 34px;
      font-weight: 700;
    }

    .selected-level .count {
      color: #777;
      margin-top: 5px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .mode-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      padding: 30px 25px;
      text-align: center;
      transition: .2s;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,.06);
    }

    .mode-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .mode-card h3 {
      margin-bottom: 8px;
    }

    .mode-card p {
      color: #777;
      font-size: 14px;
      min-height: 40px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 1px solid #d8d8d8;
      border-radius: 11px;
      padding: 12px 14px;
      outline: none;
      background: #fff;
    }

    input:focus {
      border-color: #555;
    }

    .vocab-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 9px;
      margin-bottom: 10px;
    }

    .remove-word {
      width: 42px;
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 10px;
      color: #c62828;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .test-options {
      max-width: 430px;
      margin: 0 auto;
    }

    .available-info {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .test-card {
      max-width: 680px;
      margin: 0 auto;
    }

    .progress {
      color: #777;
      text-align: center;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .prompt-label {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .prompt {
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 22px;
    }

    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .answer-field label {
      font-size: 14px;
    }

    .answer-field input {
      padding: 14px;
      font-size: 17px;
    }

    .check-area {
      text-align: center;
      margin-top: 20px;
    }

    .review-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .review-card {
      border: 1px solid #e4e4e4;
      border-radius: 15px;
      padding: 18px;
      background: #fff;
    }

    .review-card.wrong {
      border-left: 5px solid #d32f2f;
    }

    .review-number {
      color: #888;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .review-prompt {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .review-line {
      margin: 6px 0;
    }

    .review-label {
      color: #777;
      display: inline-block;
      min-width: 90px;
    }

    .wrong-answer {
      color: #d32f2f;
      font-weight: 700;
    }

    .correct-answer {
      color: #2e7d32;
      font-weight: 600;
    }

    .result-box {
      text-align: center;
      padding: 25px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 18px;
      margin-bottom: 25px;
    }

    .result-score {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .result-time {
      color: #777;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 35px 10px;
    }

    .loading {
      text-align: center;
      padding: 50px 10px;
      color: #777;
    }

    .message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 360px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #222;
      color: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
      display: none;
      z-index: 100;
    }

    .message.error {
      background: #c62828;
    }

    .message.success {
      background: #2e7d32;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 22px, 920px);
        padding-top: 25px;
      }

      .mode-grid,
      .answer-grid {
        grid-template-columns: 1fr;
      }

      .vocab-row {
        grid-template-columns: 1fr;
      }

      .remove-word {
        width: 100%;
        height: 40px;
      }

      .prompt {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="brand">學習中文</div>
  </header>

  <main class="container">

    <!-- =========================
         SCREEN 1: LEVELS
    ========================== -->
    <section id="screen-levels" class="screen active">

      <div class="page-title">
        <h1>選擇級別</h1>
        <p>選擇要學習的中文級別</p>
      </div>

      <div id="levels-loading" class="loading">
        正在載入級別...
      </div>

      <div id="level-grid" class="level-grid hidden"></div>

    </section>


    <!-- =========================
         SCREEN 2: ADD LEVEL
    ========================== -->
    <section id="screen-add-level" class="screen">

      <button class="back-btn" onclick="showLevels()">
        ← 返回級別
      </button>

      <div class="card">

        <h2>新增級別</h2>

        <div class="form-group">
          <label for="new-level">
            級別名稱
          </label>

          <input
            id="new-level"
            type="text"
            placeholder="例如：HSK1"
            maxlength="100"
          >
        </div>

        <div class="actions">
          <button
            class="primary"
            onclick="createNewLevel()"
          >
            新增級別
          </button>

          <button
            class="secondary"
            onclick="showLevels()"
          >
            取消
          </button>
        </div>

      </div>

    </section>


    <!-- =========================
         SCREEN 3: LEVEL MENU
    ========================== -->
    <section id="screen-menu" class="screen">

      <button class="back-btn" onclick="showLevels()">
        ← 返回級別
      </button>

      <div class="selected-level">
        <div id="selected-level-name" class="level"></div>
        <div id="selected-level-count" class="count"></div>
      </div>

      <div class="mode-grid">

        <div class="mode-card">
          <div class="mode-icon">📚</div>
          <h3>新增詞彙</h3>
          <p>
            添加中文、Pinying 和 English 詞彙
          </p>

          <button
            class="primary"
            onclick="showAddVocabulary()"
          >
            新增詞彙
          </button>
        </div>

        <div class="mode-card">
          <div class="mode-icon">✏️</div>
          <h3>開始測驗</h3>
          <p>
            從此級別的詞彙中隨機抽取進行測驗
          </p>

          <button
            class="primary"
            onclick="showTestSetup()"
          >
            開始測驗
          </button>
        </div>

      </div>

    </section>


    <!-- =========================
         SCREEN 4: ADD VOCABULARY
    ========================== -->
    <section id="screen-vocabulary" class="screen">

      <button class="back-btn" onclick="showLevelMenu()">
        ← 返回
      </button>

      <div class="page-title">
        <h1>新增詞彙</h1>
        <p id="vocab-level-title"></p>
      </div>

      <div class="card">

        <div id="vocab-rows"></div>

        <div class="actions">

          <button
            class="secondary"
            onclick="addVocabularyRow()"
          >
            ＋ 添加一行
          </button>

          <button
            class="primary"
            onclick="saveVocabulary()"
          >
            保存詞彙
          </button>

        </div>

      </div>

    </section>


    <!-- =========================
         SCREEN 5: TEST SETUP
    ========================== -->
    <section id="screen-test-setup" class="screen">

      <button class="back-btn" onclick="showLevelMenu()">
        ← 返回
      </button>

      <div class="page-title">
        <h1>開始測驗</h1>
        <p id="test-level-title"></p>
      </div>

      <div class="card test-options">

        <div
          id="available-info"
          class="available-info"
        ></div>

        <div class="form-group">

          <label for="test-total">
            測驗詞彙數量
          </label>

          <input
            id="test-total"
            type="number"
            min="1"
            step="1"
          >

        </div>

        <button
          class="primary"
          style="width:100%"
          onclick="startVocabularyTest()"
        >
          確認並開始測驗
        </button>

      </div>

    </section>


    <!-- =========================
         SCREEN 6: TEST
    ========================== -->
    <section id="screen-test" class="screen">

      <div class="test-card">

        <div id="test-progress" class="progress"></div>

        <div class="card">

          <div class="prompt-label">
            已知資料
          </div>

          <div
            id="test-prompt"
            class="prompt"
          ></div>

          <div class="answer-grid">

            <div class="answer-field">
              <label id="answer-label-1"></label>
              <input
                id="answer-input-1"
                type="text"
                autocomplete="off"
                onkeydown="handleAnswerKey(event)"
              >
            </div>

            <div class="answer-field">
              <label id="answer-label-2"></label>
              <input
                id="answer-input-2"
                type="text"
                autocomplete="off"
                onkeydown="handleAnswerKey(event)"
              >
            </div>

          </div>

          <div class="check-area">

            <button
              id="confirm-answer-btn"
              class="primary"
              onclick="confirmAnswer()"
            >
              確認
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- =========================
         SCREEN 7: REVIEW
    ========================== -->
    <section id="screen-review" class="screen">

      <div class="page-title">
        <h1>測驗完成</h1>
        <p>查看本次測驗結果</p>
      </div>

      <div id="result-box" class="result-box"></div>

      <div class="card">

        <h2>詞彙回顧</h2>

        <div id="review-list" class="review-list"></div>

      </div>

      <div class="actions">

        <button
          class="primary"
          onclick="showTestSetup()"
        >
          再測驗一次
        </button>

        <button
          class="secondary"
          onclick="showLevelMenu()"
        >
          返回級別
        </button>

      </div>

    </section>

  </main>

</div>

<div id="message" class="message"></div>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbw2JMe9gb_5bFgWxlspBkQ2KLb-DRi07atMsG2BY3LETBMLXmBz_yYrvXjEqDkkmxoF/exec';


/*************************************************
 * STATE
 *************************************************/

let levels = [];
let selectedLevel = null;

let vocabulary = [];

let testWords = [];
let testAnswers = [];
let currentQuestion = 0;

let testId = null;
let testStartedAt = null;

let testCorrect = 0;


/*************************************************
 * INITIALIZE
 *************************************************/

document.addEventListener('DOMContentLoaded', () => {
  loadLevels();
});


/*************************************************
 * API
 *************************************************/

async function apiGet(action, params = {}) {

  const url = new URL(API_URL);

  url.searchParams.set('action', action);

  Object.entries(params).forEach(([key, value]) => {
    if (value !== undefined && value !== null) {
      url.searchParams.set(key, value);
    }
  });

  const response = await fetch(url.toString(), {
    method: 'GET',
    redirect: 'follow'
  });

  if (!response.ok) {
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  const data = await response.json();

  if (!data.success) {
    throw new Error(
      data.error || 'API error'
    );
  }

  return data;
}


async function apiPost(action, payload = {}) {

  const body = {
    action,
    ...payload
  };

  /*
   * Apps Script Web App thường hoạt động
   * ổn định hơn với text/plain khi gọi từ
   * GitHub Pages và vẫn được parse bởi
   * parseRequestData_().
   */

  const response = await fetch(API_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(body)
  });

  if (!response.ok) {
    throw new Error(
      `HTTP ${response.status}`
    );
  }

  const data = await response.json();

  if (!data.success) {
    throw new Error(
      data.error || 'API error'
    );
  }

  return data;
}


/*************************************************
 * SCREEN
 *************************************************/

function showScreen(id) {

  document
    .querySelectorAll('.screen')
    .forEach(screen => {
      screen.classList.remove('active');
    });

  const target =
    document.getElementById(id);

  if (target) {
    target.classList.add('active');
  }

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}


function showLevels() {
  showScreen('screen-levels');
  loadLevels();
}


function showLevelMenu() {

  if (!selectedLevel) {
    showLevels();
    return;
  }

  updateSelectedLevelUI();

  showScreen('screen-menu');
}


function showAddLevel() {

  document.getElementById('new-level').value = '';

  showScreen('screen-add-level');

  setTimeout(() => {
    document
      .getElementById('new-level')
      .focus();
  }, 100);
}


function showAddVocabulary() {

  document.getElementById(
    'vocab-level-title'
  ).textContent =
    selectedLevel;

  const container =
    document.getElementById('vocab-rows');

  container.innerHTML = '';

  addVocabularyRow();
  addVocabularyRow();
  addVocabularyRow();

  showScreen('screen-vocabulary');
}


function showTestSetup() {

  document.getElementById(
    'test-level-title'
  ).textContent =
    selectedLevel;

  const levelData =
    levels.find(
      item => item.level === selectedLevel
    );

  const count =
    levelData
      ? Number(levelData.wordCount || 0)
      : 0;

  document.getElementById(
    'available-info'
  ).textContent =
    `目前共有 ${count} 個詞彙`;

  const input =
    document.getElementById('test-total');

  input.value =
    count > 0 ? Math.min(10, count) : '';

  input.max = count;

  showScreen('screen-test-setup');
}


/*************************************************
 * LEVELS
 *************************************************/

async function loadLevels() {

  const loading =
    document.getElementById('levels-loading');

  const grid =
    document.getElementById('level-grid');

  loading.classList.remove('hidden');
  grid.classList.add('hidden');

  try {

    const data =
      await apiGet('levels');

    /*
     * QUAN TRỌNG:
     * Không xóa state cũ nếu API lỗi.
     */

    levels =
      Array.isArray(data.levels)
        ? data.levels
        : [];

    renderLevels();

  } catch (error) {

    console.error(error);

    /*
     * Không được set levels = []
     * khi request thất bại.
     */

    showMessage(
      '無法載入級別：' +
      error.message,
      'error'
    );

  } finally {

    loading.classList.add('hidden');

    /*
     * Chỉ hiện grid nếu thực sự có dữ liệu.
     */

    if (levels.length > 0) {
      grid.classList.remove('hidden');
    }
  }
}


function renderLevels() {

  const grid =
    document.getElementById('level-grid');

  grid.innerHTML = '';

  if (!levels.length) {

    grid.innerHTML = `
      <div class="empty"
           style="grid-column:1/-1">
        尚未建立級別
      </div>
    `;

  } else {

    levels.forEach(item => {

      const card =
        document.createElement('button');

      card.type = 'button';
      card.className = 'level-card';

      card.innerHTML = `
        <div class="level-name">
          ${escapeHtml(item.level)}
        </div>

        <div class="word-count">
          ${Number(item.wordCount || 0)} 個詞彙
        </div>
      `;

      card.onclick = () => {
        selectLevel(item.level);
      };

      grid.appendChild(card);
    });
  }

  /*
   * Thêm cấp độ luôn nằm cuối danh sách.
   */

  const addCard =
    document.createElement('button');

  addCard.type = 'button';
  addCard.className =
    'level-card add-level-card';

  addCard.innerHTML = `
    <div class="add-level-symbol">＋</div>
    <div class="level-name"
         style="font-size:18px">
      新增級別
    </div>
  `;

  addCard.onclick = showAddLevel;

  grid.appendChild(addCard);

  grid.classList.remove('hidden');
}


function selectLevel(level) {

  selectedLevel = level;

  updateSelectedLevelUI();

  showScreen('screen-menu');
}


function updateSelectedLevelUI() {

  document.getElementById(
    'selected-level-name'
  ).textContent =
    selectedLevel;

  const levelData =
    levels.find(
      item => item.level === selectedLevel
    );

  const count =
    levelData
      ? Number(levelData.wordCount || 0)
      : 0;

  document.getElementById(
    'selected-level-count'
  ).textContent =
    `${count} 個詞彙`;
}


/*************************************************
 * CREATE LEVEL
 *************************************************/

async function createNewLevel() {

  const input =
    document.getElementById('new-level');

  const level =
    input.value.trim();

  if (!level) {

    showMessage(
      '請輸入級別名稱。',
      'error'
    );

    return;
  }

  try {

    input.disabled = true;

    /*
     * ĐÚNG API:
     * createLevel
     */

    const data =
      await apiPost(
        'createLevel',
        {
          level
        }
      );

    showMessage(
      `${level} 已建立。`,
      'success'
    );

    selectedLevel = level;

    /*
     * Tải lại danh sách từ server.
     */

    await loadLevels();

    /*
     * Sau khi tạo xong đi thẳng
     * vào menu cấp độ.
     */

    showLevelMenu();

  } catch (error) {

    console.error(error);

    showMessage(
      '建立級別失敗：' +
      error.message,
      'error'
    );

  } finally {

    input.disabled = false;
  }
}


/*************************************************
 * VOCABULARY
 *************************************************/

function addVocabularyRow(
  chinese = '',
  pinyin = '',
  english = ''
) {

  const container =
    document.getElementById('vocab-rows');

  const row =
    document.createElement('div');

  row.className = 'vocab-row';

  row.innerHTML = `
    <input
      type="text"
      class="vocab-chinese"
      placeholder="中文"
      value="${escapeAttribute(chinese)}"
    >

    <input
      type="text"
      class="vocab-pinyin"
      placeholder="Pinying"
      value="${escapeAttribute(pinyin)}"
    >

    <input
      type="text"
      class="vocab-english"
      placeholder="English"
      value="${escapeAttribute(english)}"
    >

    <button
      type="button"
      class="remove-word"
      title="刪除"
    >
      ×
    </button>
  `;

  row
    .querySelector('.remove-word')
    .onclick = () => {
      row.remove();
    };

  container.appendChild(row);
}


async function saveVocabulary() {

  const rows =
    document.querySelectorAll('.vocab-row');

  const words = [];

  rows.forEach(row => {

    const chinese =
      row
        .querySelector('.vocab-chinese')
        .value
        .trim();

    const pinyin =
      row
        .querySelector('.vocab-pinyin')
        .value
        .trim();

    const english =
      row
        .querySelector('.vocab-english')
        .value
        .trim();

    /*
     * Chỉ gửi những dòng có Chinese.
     */

    if (chinese) {

      words.push({
        chinese,
        pinyin,
        english
      });
    }
  });

  if (!words.length) {

    showMessage(
      '請至少輸入一個中文詞彙。',
      'error'
    );

    return;
  }

  try {

    const buttons =
      document.querySelectorAll(
        '#screen-vocabulary button'
      );

    buttons.forEach(
      button => button.disabled = true
    );

    /*
     * ĐÚNG API:
     * addVocabulary
     */

    const data =
      await apiPost(
        'addVocabulary',
        {
          level: selectedLevel,
          words
        }
      );

    showMessage(
      `已保存 ${data.inserted} 個詞彙。`,
      'success'
    );

    /*
     * Cập nhật wordCount local.
     */

    const levelData =
      levels.find(
        item => item.level === selectedLevel
      );

    if (levelData) {
      levelData.wordCount =
        Number(data.wordCount || 0);
    }

    updateSelectedLevelUI();

    /*
     * Reset form và quay lại menu.
     */

    showLevelMenu();

  } catch (error) {

    console.error(error);

    showMessage(
      '保存詞彙失敗：' +
      error.message,
      'error'
    );

  } finally {

    const buttons =
      document.querySelectorAll(
        '#screen-vocabulary button'
      );

    buttons.forEach(
      button => button.disabled = false
    );
  }
}


/*************************************************
 * TEST SETUP
 *************************************************/

async function startVocabularyTest() {

  if (!selectedLevel) {
    return;
  }

  const input =
    document.getElementById('test-total');

  const total =
    Number(input.value);

  const levelData =
    levels.find(
      item => item.level === selectedLevel
    );

  const available =
    levelData
      ? Number(levelData.wordCount || 0)
      : 0;

  if (
    !Number.isInteger(total) ||
    total <= 0
  ) {

    showMessage(
      '請輸入正確的詞彙數量。',
      'error'
    );

    return;
  }

  if (total > available) {

    showMessage(
      `最多只能測驗 ${available} 個詞彙。`,
      'error'
    );

    return;
  }

  if (available <= 0) {

    showMessage(
      '此級別尚未有詞彙。',
      'error'
    );

    return;
  }

  try {

    /*
     * Lấy vocabulary mới nhất từ Google Sheet.
     */

    const vocabData =
      await apiGet(
        'vocabulary',
        {
          level: selectedLevel
        }
      );

    vocabulary =
      Array.isArray(vocabData.words)
        ? vocabData.words
        : [];

    if (vocabulary.length < total) {

      throw new Error(
        '詞彙數量不足。'
      );
    }

    /*
     * Shuffle rồi lấy số lượng cần kiểm tra.
     */

    testWords =
      shuffle(
        [...vocabulary]
      ).slice(0, total);

    testAnswers = [];

    currentQuestion = 0;
    testCorrect = 0;

    /*
     * BẮT ĐẦU SESSION TRÊN APPS SCRIPT
     *
     * Đây là thời điểm timer bắt đầu.
     */

    const startData =
      await apiPost(
        'startTest',
        {
          level: selectedLevel,
          total
        }
      );

    testId =
      startData.testId;

    testStartedAt =
      startData.startedAt;

    showScreen('screen-test');

    renderQuestion();

  } catch (error) {

    console.error(error);

    showMessage(
      '無法開始測驗：' +
      error.message,
      'error'
    );
  }
}


/*************************************************
 * TEST QUESTION
 *************************************************/

function renderQuestion() {

  if (
    currentQuestion >= testWords.length
  ) {
    finishLocalTest();
    return;
  }

  const word =
    testWords[currentQuestion];

  /*
   * Random 1 trong 3 loại để hiển thị.
   *
   * 0 = Chinese
   * 1 = Pinyin
   * 2 = English
   */

  const promptType =
    Math.floor(Math.random() * 3);

  word.promptType =
    promptType;

  let prompt = '';
  let missingTypes = [];

  if (promptType === 0) {

    prompt = word.chinese;

    missingTypes = [
      'pinyin',
      'english'
    ];

  } else if (promptType === 1) {

    prompt = word.pinyin;

    missingTypes = [
      'chinese',
      'english'
    ];

  } else {

    prompt = word.english;

    missingTypes = [
      'chinese',
      'pinyin'
    ];
  }

  document.getElementById(
    'test-progress'
  ).textContent =
    `第 ${currentQuestion + 1} / ${testWords.length} 題`;

  document.getElementById(
    'test-prompt'
  ).textContent =
    prompt;

  const label1 =
    document.getElementById(
      'answer-label-1'
    );

  const label2 =
    document.getElementById(
      'answer-label-2'
    );

  const input1 =
    document.getElementById(
      'answer-input-1'
    );

  const input2 =
    document.getElementById(
      'answer-input-2'
    );

  label1.textContent =
    getTypeName(missingTypes[0]);

  label2.textContent =
    getTypeName(missingTypes[1]);

  input1.value = '';
  input2.value = '';

  input1.dataset.type =
    missingTypes[0];

  input2.dataset.type =
    missingTypes[1];

  /*
   * Chỉ hiển thị prompt.
   * Hai phần còn lại hoàn toàn ẩn.
   */

  setTimeout(() => {
    input1.focus();
  }, 100);
}


function getTypeName(type) {

  if (type === 'chinese') {
    return '中文';
  }

  if (type === 'pinyin') {
    return 'Pinying';
  }

  return 'English';
}


/*************************************************
 * ANSWER
 *************************************************/

function handleAnswerKey(event) {

  if (event.key === 'Enter') {

    event.preventDefault();

    const first =
      document.getElementById(
        'answer-input-1'
      );

    const second =
      document.getElementById(
        'answer-input-2'
      );

    if (
      document.activeElement === first
    ) {
      second.focus();
      return;
    }

    confirmAnswer();
  }
}


function confirmAnswer() {

  const word =
    testWords[currentQuestion];

  if (!word) return;

  const input1 =
    document.getElementById(
      'answer-input-1'
    );

  const input2 =
    document.getElementById(
      'answer-input-2'
    );

  const answer1 =
    input1.value.trim();

  const answer2 =
    input2.value.trim();

  if (!answer1 || !answer2) {

    showMessage(
      '請填寫兩個答案。',
      'error'
    );

    return;
  }

  const result1 =
    checkAnswer(
      input1.dataset.type,
      answer1,
      word
    );

  const result2 =
    checkAnswer(
      input2.dataset.type,
      answer2,
      word
    );

  const isCorrect =
    result1.correct &&
    result2.correct;

  if (isCorrect) {
    testCorrect++;
  }

  /*
   * Lưu toàn bộ dữ liệu để review.
   */

  testAnswers.push({
    word,
    promptType: word.promptType,

    answers: {
      [input1.dataset.type]: answer1,
      [input2.dataset.type]: answer2
    },

    checks: {
      [input1.dataset.type]: result1.correct,
      [input2.dataset.type]: result2.correct
    },

    correct: isCorrect
  });

  currentQuestion++;

  renderQuestion();
}


/*************************************************
 * ANSWER CHECKING
 *************************************************/

function checkAnswer(
  type,
  userAnswer,
  word
) {

  if (type === 'chinese') {

    return {
      correct:
        normalizeChinese(userAnswer) ===
        normalizeChinese(word.chinese)
    };
  }

  if (type === 'pinyin') {

    return {
      correct:
        normalizePinyin(userAnswer) ===
        normalizePinyin(word.pinyin)
    };
  }

  return {
    correct:
      normalizeEnglish(userAnswer) ===
      normalizeEnglish(word.english)
  };
}


/*************************************************
 * PINYIN FLEXIBLE CHECK
 *
 * Chấp nhận:
 *
 * nǐ hǎo
 * ni hao
 * ni3 hao3
 *
 * Và chuẩn hóa:
 *
 * ü -> u
 * v -> u
 *************************************************/

function normalizePinyin(value) {

  let text =
    String(value || '')
      .trim()
      .toLowerCase();

  /*
   * Chuyển tone number:
   * ni3 -> ni
   * hao3 -> hao
   */

  text =
    text.replace(
      /([a-züv]+)[1-5](?=\s|$)/gi,
      '$1'
    );

  /*
   * Chuyển pinyin có dấu về chữ không dấu.
   */

  const toneMap = {
    'ā':'a',
    'á':'a',
    'ǎ':'a',
    'à':'a',

    'ē':'e',
    'é':'e',
    'ě':'e',
    'è':'e',

    'ī':'i',
    'í':'i',
    'ǐ':'i',
    'ì':'i',

    'ō':'o',
    'ó':'o',
    'ǒ':'o',
    'ò':'o',

    'ū':'u',
    'ú':'u',
    'ǔ':'u',
    'ù':'u',

    'ǖ':'u',
    'ǘ':'u',
    'ǚ':'u',
    'ǜ':'u',

    'Ā':'a',
    'Á':'a',
    'Ǎ':'a',
    'À':'a',

    'Ē':'e',
    'É':'e',
    'Ě':'e',
    'È':'e',

    'Ī':'i',
    'Í':'i',
    'Ǐ':'i',
    'Ì':'i',

    'Ō':'o',
    'Ó':'o',
    'Ǒ':'o',
    'Ò':'o',

    'Ū':'u',
    'Ú':'u',
    'Ǔ':'u',
    'Ù':'u',

    'Ǖ':'u',
    'Ǘ':'u',
    'Ǚ':'u',
    'Ǜ':'u'
  };

  text =
    text
      .split('')
      .map(char =>
        toneMap[char] || char
      )
      .join('');

  /*
   * ü / v đều được chấp nhận là u.
   */

  text =
    text.replace(/ü/g, 'u');
  text =
    text.replace(/v/g, 'u');

  /*
   * Xóa khoảng trắng và ký tự phụ.
   */

  text =
    text
      .replace(/[^a-z0-9]/g, '')
      .trim();

  return text;
}


function normalizeChinese(value) {

  return String(value || '')
    .trim()
    .replace(/\s+/g, '');
}


function normalizeEnglish(value) {

  return String(value || '')
    .toLowerCase()
    .trim()
    .replace(/[.,!?;:'"]/g, '')
    .replace(/\s+/g, ' ');
}


/*************************************************
 * FINISH TEST
 *************************************************/

async function finishLocalTest() {

  try {

    /*
     * Gửi kết quả lên Apps Script.
     *
     * Apps Script tự tính thời gian:
     * finish time - start time.
     */

    const finishData =
      await apiPost(
        'finishTest',
        {
          testId,
          correct: testCorrect,
          total: testWords.length
        }
      );

    renderReview(
      finishData
    );

    showScreen('screen-review');

  } catch (error) {

    console.error(error);

    showMessage(
      '保存測驗結果失敗：' +
      error.message,
      'error'
    );
  }
}


/*************************************************
 * REVIEW
 *************************************************/

function renderReview(
  finishData
) {

  const resultBox =
    document.getElementById(
      'result-box'
    );

  resultBox.innerHTML = `
    <div class="result-score">
      ${escapeHtml(finishData.result)}
    </div>

    <div class="result-time">
      用時 ${escapeHtml(finishData.time)}
    </div>
  `;

  const list =
    document.getElementById(
      'review-list'
    );

  list.innerHTML = '';

  testAnswers.forEach(
    (item, index) => {

      const card =
        document.createElement('div');

      card.className =
        'review-card' +
        (
          item.correct
            ? ''
            : ' wrong'
        );

      const word =
        item.word;

      let answerHtml = '';

      /*
       * Hiển thị đủ 3 trường ở review.
       * Những phần người dùng nhập sai
       * sẽ được tô đỏ.
       */

      answerHtml +=
        createReviewLine(
          '中文',
          word.chinese,
          item.answers.chinese,
          item.checks.chinese
        );

      answerHtml +=
        createReviewLine(
          'Pinying',
          word.pinyin,
          item.answers.pinyin,
          item.checks.pinyin
        );

      answerHtml +=
        createReviewLine(
          'English',
          word.english,
          item.answers.english,
          item.checks.english
        );

      card.innerHTML = `
        <div class="review-number">
          第 ${index + 1} 題
        </div>

        <div class="review-prompt">
          ${escapeHtml(
            getPromptValue(item)
          )}
        </div>

        ${answerHtml}

        <div style="margin-top:12px;font-weight:700;
                    color:${item.correct ? '#2e7d32' : '#d32f2f'}">
          ${
            item.correct
              ? '✓ 正確'
              : '✗ 有錯誤'
          }
        </div>
      `;

      list.appendChild(card);
    }
  );
}


function createReviewLine(
  label,
  correctValue,
  userValue,
  isCorrect
) {

  /*
   * Prompt đang hiển thị không phải
   * là phần user nhập.
   */

  if (
    userValue === undefined ||
    userValue === null
  ) {

    return `
      <div class="review-line">
        <span class="review-label">
          ${escapeHtml(label)}
        </span>

        <span class="correct-answer">
          ${escapeHtml(correctValue)}
        </span>
      </div>
    `;
  }

  if (isCorrect) {

    return `
      <div class="review-line">
        <span class="review-label">
          ${escapeHtml(label)}
        </span>

        <span class="correct-answer">
          ${escapeHtml(userValue)}
        </span>
      </div>
    `;

  }

  /*
   * Sai:
   *
   * Người dùng nhập: ...
   * Đáp án đúng: ...
   */

  return `
    <div class="review-line">
      <span class="review-label">
        ${escapeHtml(label)}
      </span>

      <span class="wrong-answer">
        ${escapeHtml(userValue || '(空白)')}
      </span>

      <span style="color:#777">
        → 
      </span>

      <span class="correct-answer">
        ${escapeHtml(correctValue)}
      </span>
    </div>
  `;
}


function getPromptValue(item) {

  if (item.promptType === 0) {
    return item.word.chinese;
  }

  if (item.promptType === 1) {
    return item.word.pinyin;
  }

  return item.word.english;
}


/*************************************************
 * UTILITIES
 *************************************************/

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];
  }

  return array;
}


function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function escapeAttribute(value) {

  return escapeHtml(value);
}


/*************************************************
 * MESSAGE
 *************************************************/

let messageTimer = null;

function showMessage(
  text,
  type = ''
) {

  const element =
    document.getElementById('message');

  element.textContent = text;

  element.className =
    'message ' + type;

  element.style.display =
    'block';

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(() => {

      element.style.display =
        'none';

    }, 3500);
}
